site_name: CHERT IoT docs
copyright: "CHERT IoT"
site_url: https://chertiot.com/docs/
site_description: Getting started with your CHERT IoT lab.
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  # Arabic is translation-only across CHERT: LTR layout in every language (Material would emit
  # dir="rtl" for `ar`).
  direction: ltr
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features: [navigation.sections, navigation.top, navigation.footer, content.code.copy, search.suggest]
  # `custom` lets assets/chert.css define the colours (the CHERT tokens); a named palette such as the
  # default indigo would override them via [data-md-color-primary].
  palette:
    scheme: default
    primary: custom
    accent: custom
extra_css: [assets/chert.css]
nav:
  - Start here: index.md
  - Getting started:
      - ESP32 (Arduino): getting-started/esp32-arduino.md
      - ESP32 (MicroPython): getting-started/esp32-micropython.md
      - Raspberry Pi (Python): getting-started/rpi-python.md
      - Browser (no hardware): getting-started/browser.md
  - Guides:
      - MQTT, topics and your token: guides/mqtt-and-auth.md
      - Your dashboard: guides/dashboard.md
      - LoRaWAN gateways: guides/lorawan.md
      - Limits and what you can't do (yet): guides/limits.md
  - Policies:
      - Fair use: policies/fair-use.md
      - Privacy: policies/privacy.md
      - Service expectations: policies/service.md
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
        - locale: ar
          name: العربية
          build: true
          site_name: "وثائق CHERT IoT"
          site_description: "ابدأ مع مختبر إنترنت الأشياء الخاص بك في CHERT IoT."
          nav_translations:
            Start here: ابدأ هنا
            Getting started: البدء
            Browser (no hardware): المتصفّح (بلا عتاد)
            Guides: الأدلة
            MQTT, topics and your token: MQTT والمواضيع ورمزك
            Your dashboard: لوحتك
            LoRaWAN gateways: بوابات LoRaWAN
            Limits and what you can't do (yet): الحدود وما لا يمكنك فعله (بعد)
            Policies: السياسات
            Fair use: الاستخدام العادل
            Privacy: الخصوصية
            Service expectations: توقّعات الخدمة

markdown_extensions: [admonition, attr_list, tables, pymdownx.superfences, pymdownx.tabbed, toc]
extra:
  generator: false
