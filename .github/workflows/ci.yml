name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - run: uv --directory portal sync --frozen
      - run: make lint
      - run: uv --directory portal run pytest tests/unit -q

  stack-e2e:
    # Full stack: e2e (signup/SSO/devices) + tenancy isolation. ~6 min. Push to main + PRs.
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - run: uv --directory portal sync --frozen
      - name: ghcr.io login (pull the published Caddy image)
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: deploy/scripts/ci-env.sh
      - run: deploy/scripts/write-runtime-secrets.sh
      - run: docker compose --profile core up -d --build
      - run: make wait-healthy
      - run: make bootstrap
      - run: make test
      - run: make e2e
      - run: make platform-test
      - if: failure()
        run: docker compose --profile core logs --tail 200 tb keycloak portal
