name: images
# Reproducible platform images, built in CI and pushed to GHCR (never on a workstation):
#  - chertiot/caddy:<ver>-l4       (xcaddy: layer4 + replace-response)
#  - chertiot/tb:<ver>-bN          (ThingsBoard CE + brand patch series, thingsboard-brand/build.sh)
#  - chertiot/nodered:<ver>-bN     (Node-RED + Arabic ar-AR default, LTR-only, nodered-brand/Dockerfile)
#  - chertiot/grafana:<ver>-bN     (Grafana + Arabic ar-SA locale, LTR-only, grafana-brand/build.sh)
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which image to build (manual runs only)"
        type: choice
        default: all
        options: [all, caddy, nodered, grafana, thingsboard]
  push:
    tags: ["v*"]
    paths-ignore: []
permissions:
  contents: read
  packages: write
jobs:
  caddy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'caddy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: make caddy-image
      - run: |
          VER=$(grep ^CADDY_VERSION= .env.example | cut -d= -f2)
          docker tag chertiot/caddy:${VER}-l4 ghcr.io/${{ github.repository_owner }}/chertiot-caddy:${VER}-l4
          docker push ghcr.io/${{ github.repository_owner }}/chertiot-caddy:${VER}-l4
  nodered:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'nodered' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: python3 nodered-brand/validate_catalogs.py   # parity + protected-token + LTR gate
      - run: |
          VER=$(grep ^NODERED_VERSION= .env.example | cut -d= -f2)
          BN=$(cat nodered-brand/BUILD_NUMBER)
          IMG=ghcr.io/${{ github.repository_owner }}/chertiot-nodered:${VER}-b${BN}
          docker build --build-arg NODERED_VERSION=${VER} -t "$IMG" nodered-brand/
          docker push "$IMG"
  grafana:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'grafana' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120        # Go + Node + webpack full frontend build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Fail closed on tag/commit mismatch; register ar-SA; install + schema-validate locales;
      # run the ar-SA runtime fallback test and the Grafana jest registration tests; docker build.
      - run: RUN_GRAFANA_JEST=1 grafana-brand/build.sh
      - run: grafana-brand/smoke.sh "$(cat grafana-brand/LAST_IMAGE)"
      - run: |
          IMG=$(cat grafana-brand/LAST_IMAGE)
          docker tag "$IMG" "ghcr.io/${{ github.repository_owner }}/chertiot-grafana:${IMG#chertiot/grafana:}"
          docker push "ghcr.io/${{ github.repository_owner }}/chertiot-grafana:${IMG#chertiot/grafana:}"
  thingsboard:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image == 'all' || inputs.image == 'thingsboard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }   # no cache: pom.xml only exists after build.sh clones upstream
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: thingsboard-brand/build.sh
      - run: thingsboard-brand/smoke.sh "$(cat thingsboard-brand/LAST_IMAGE)"
      - run: |
          IMG=$(cat thingsboard-brand/LAST_IMAGE)
          docker tag "$IMG" "ghcr.io/${{ github.repository_owner }}/chertiot-tb:${IMG#chertiot/tb:}"
          docker push "ghcr.io/${{ github.repository_owner }}/chertiot-tb:${IMG#chertiot/tb:}"
