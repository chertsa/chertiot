name: nightly
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: read

jobs:
  flood:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
      - run: uv --directory portal sync --frozen
      - name: ghcr.io login (pull the published Caddy image)
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: deploy/scripts/ci-env.sh
      - run: deploy/scripts/write-runtime-secrets.sh
      - run: docker compose --profile core up -d --build
      - run: make wait-healthy
      - run: make bootstrap
      - run: make flood-test
