# CHERT IoT — Docker Compose. Profiles: core | flows | lab | lora (PLAN.md §2).
# Every image is pinned via .env (see .env.example). Every stateful service uses a named volume.
name: chertiot

x-restart: &restart
  restart: unless-stopped
x-logging: &logging
  logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }

services:
  # ---------------------------------------------------------------- core
  postgres:
    <<: [*restart, *logging]
    image: postgres:${POSTGRES_VERSION}
    profiles: [core, lora]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: installs TB schema on first run, then no-ops. Idempotent via marker file.
  tb-install:
    <<: *logging
    image: ${TB_IMAGE}
    profiles: [core]
    restart: "no"
    user: "0:0"   # one-shot installer only: needs to write the marker in the root-owned volume
    env_file: deploy/tb/tb-node.env
    environment:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS: ${TB_JAVA_OPTS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /state/.installed ]; then echo "ThingsBoard already installed"; exit 0; fi
        INSTALL_TB=true LOAD_DEMO=false start-tb-node.sh && touch /state/.installed
    volumes:
      - tb-install-state:/state
    depends_on:
      postgres: { condition: service_healthy }

  tb:
    <<: [*restart, *logging]
    image: ${TB_IMAGE}
    profiles: [core]
    env_file: deploy/tb/tb-node.env
    environment:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS: ${TB_JAVA_OPTS}
    ports:
      - "1883:1883"      # MQTT plaintext for local dev only; prod exposes 8883 via Caddy layer4 (D8)
    volumes:
      - tb-data:/data
      - tb-logs:/var/log/thingsboard
    healthcheck:
      # tb-node image ships no curl/wget; probe the HTTP port with bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /login HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      tb-install: { condition: service_completed_successfully }

  keycloak:
    <<: [*restart, *logging]
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    profiles: [core]
    command: ["start"]   # pre-built --optimized image: BACKLOG
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
      KC_SPI_THEME_CACHE_THEMES: "false"   # dev convenience; harmless in prod (themes are static files)
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/theme/chertiot:/opt/keycloak/themes/chertiot:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }

  portal:
    <<: [*restart, *logging]
    networks: [default, spawner, flows]
    build:
      context: .
      dockerfile: portal/Dockerfile
    image: chertiot/portal:dev
    profiles: [core]
    environment:
      ENV: ${ENV}
      DOMAIN: ${DOMAIN}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY}
      PORTAL_DATABASE_URL: ${PORTAL_DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_INTERNAL_URL: ${KC_INTERNAL_URL}
      KC_REALM: ${KC_REALM}
      KC_SECRET_PORTAL: ${KC_SECRET_PORTAL}
      TB_ADMIN_URL: http://tb:8080
      TB_PUBLIC_URL: ${TB_PUBLIC_URL}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      FLOWS_ENABLED: ${FLOWS_ENABLED}
      LAB_INTERNAL_SECRET: ${LAB_INTERNAL_SECRET}
      LORA_ENABLED: ${LORA_ENABLED}
      CHIRPSTACK_GRPC: chirpstack:8080
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET}
      LORA_MQTT_HOST: mosquitto
      DOCKER_HOST: tcp://socket-proxy:2375
      NODERED_VERSION: ${NODERED_VERSION}
      COMPOSE_PROJECT: chertiot
      TB_SYSADMIN_EMAIL: ${TB_SYSADMIN_EMAIL}
      TB_SYSADMIN_PASSWORD: ${TB_SYSADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      tb: { condition: service_healthy }

  docs:
    <<: [*restart, *logging]
    build: ./docs-site
    image: chertiot/docs:dev
    profiles: [core]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    <<: [*restart, *logging]
    networks: [default, flows]
    # Dev: stock caddy. Staging/prod: chertiot/caddy:<ver>-l4 (layer4 MQTTS, D8) built by `make caddy-image`.
    image: ${CADDY_IMAGE}
    profiles: [core]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8883:8883"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./${CADDYFILE}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- monitoring (admin-only)
  alertmanager:
    <<: [*restart, *logging]
    image: prom/alertmanager:v0.34.0
    profiles: [core]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/alertmanager_smtp_password:/etc/alertmanager/secrets/smtp_password:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  prometheus:
    <<: [*restart, *logging]
    image: prom/prometheus:${PROMETHEUS_VERSION}
    profiles: [core]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    <<: [*restart, *logging]
    image: grafana/grafana:${GRAFANA_VERSION}
    profiles: [core]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on: [prometheus]

  uptime-kuma:
    <<: [*restart, *logging]
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION}
    profiles: [core]
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5

  node-exporter:
    <<: [*restart, *logging]
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    profiles: [core]
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/host/var/lib/node_exporter/textfile"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    <<: [*restart, *logging]
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    profiles: [core]
    privileged: true
    # Default 1s housekeeping burns a full core on a busy host; 30s is plenty for capacity graphs.
    command: ["--housekeeping_interval=30s", "--docker_only=true", "--store_container_labels=false"]
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres-exporter:
    <<: [*restart, *logging]
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION}
    profiles: [core]
    environment:
      DATA_SOURCE_URI: postgres:5432/thingsboard?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  # ---------------------------------------------------------------- flows (Phase 3, M3.1)
  socket-proxy:
    <<: [*restart, *logging]
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION}
    profiles: [flows, lab]
    environment:
      # Least privilege: the spawner may manage containers/images/volumes/networks — nothing else.
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      POST: 1
      EXEC: 0
      INFO: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [spawner]

  # Warms the Node-RED image so the first student spawn is fast.
  nodered-image:
    image: nodered/node-red:${NODERED_VERSION}
    profiles: [flows]
    entrypoint: ["true"]
    restart: "no"

  # ---------------------------------------------------------------- lab (Phase 3, M3.2)
  jupyterhub:
    <<: [*restart, *logging]
    build: ./lab/hub
    image: chertiot/jupyterhub:dev
    profiles: [lab]
    networks: [default, spawner]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      DOMAIN: ${DOMAIN}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_INTERNAL_URL: ${KC_INTERNAL_URL}
      KC_REALM: ${KC_REALM}
      KC_SECRET_JUPYTERHUB: ${KC_SECRET_JUPYTERHUB}
      LAB_NOTEBOOK_IMAGE: chertiot/notebook:dev
      LAB_NETWORK: chertiot_default
      LAB_INTERNAL_SECRET: ${LAB_INTERNAL_SECRET}
      LORA_ENABLED: ${LORA_ENABLED}
      CHIRPSTACK_GRPC: chirpstack:8080
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET}
      LORA_MQTT_HOST: mosquitto
      TB_INTERNAL_URL: http://tb:8080
    volumes:
      - jupyterhub-data:/srv/jupyterhub
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/hub/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5

  notebook-image:
    build: ./lab/notebook
    image: chertiot/notebook:dev
    profiles: [lab]
    entrypoint: ["true"]
    restart: "no"

  # ---------------------------------------------------------------- lora (Phase 4, M4.1)
  redis:
    <<: [*restart, *logging]
    image: redis:${REDIS_VERSION}
    profiles: [lora]
    command: ["redis-server", "--save", "300", "1"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  mosquitto:
    <<: [*restart, *logging]
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    profiles: [lora]
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  chirpstack:
    <<: [*restart, *logging]
    image: chirpstack/chirpstack:${CHIRPSTACK_VERSION}
    profiles: [lora]
    command: ["-c", "/etc/chirpstack"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET}
    volumes:
      - ./deploy/chirpstack/chirpstack.toml:/etc/chirpstack/chirpstack.toml:ro
      - ./deploy/chirpstack/region_eu868.toml:/etc/chirpstack/region_eu868.toml:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mosquitto: { condition: service_started }
    healthcheck:
      # chirpstack:8080 is gRPC (HTTP/2); a plain readiness TCP check on the port.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s


  chirpstack-gateway-bridge:
    <<: [*restart, *logging]
    image: chirpstack/chirpstack-gateway-bridge:${CHIRPSTACK_GW_BRIDGE_VERSION}
    profiles: [lora]
    ports:
      - "1700:1700/udp"   # Semtech UDP — real LoRa gateways point here
    volumes:
      - ./deploy/chirpstack/gateway-bridge.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml:ro
    depends_on:
      mosquitto: { condition: service_started }

  # lora-bridge: forwards ChirpStack uplink events to each student's ThingsBoard device (M4.1).
  lora-bridge:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: portal/Dockerfile
    image: chertiot/portal:dev
    profiles: [lora]
    command: ["/app/.venv/bin/python", "-m", "scripts.lora_bridge"]
    healthcheck:
      disable: true
    environment:
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY}
      PORTAL_DATABASE_URL: ${PORTAL_DATABASE_URL}
      TB_ADMIN_URL: http://tb:8080
      TB_SYSADMIN_EMAIL: ${TB_SYSADMIN_EMAIL}
      TB_SYSADMIN_PASSWORD: ${TB_SYSADMIN_PASSWORD}
      LORA_MQTT_HOST: mosquitto
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }

  # lora profile is complete (Phase 4, M4.1).

networks:
  default:
  # Spawned per-student Node-RED containers live here (reachable by caddy + portal, not the socket proxy).
  flows:
  # Only the portal and the socket proxy share this network.
  spawner:

volumes:
  redis-data:
  mosquitto-data:
  jupyterhub-data:
  alertmanager-data:
  postgres-data:
  tb-data:
  tb-logs:
  tb-install-state:
  keycloak-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  uptime-kuma-data:
