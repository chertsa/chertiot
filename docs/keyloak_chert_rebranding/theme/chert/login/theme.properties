parent=keycloak.v2
import=common/keycloak
# CHERT universal Keycloak login theme (sign-in, forgot password and every other login page).
# keycloak.v2 loads its PatternFly 5 base automatically; this theme only adds the CHERT override.
# Never list css/login.css: it doesn't exist here or in the parent, and Keycloak would serve a 404
# with an empty MIME type that the browser refuses (console error).
#
# Cache-busting (REQUIRED): Keycloak serves theme resources at /resources/<keycloak-build>/... with
# cache-control max-age=30 days, and that path does NOT change when this theme changes, so browsers
# would keep the old CSS for a month. Each asset is referenced as <path>?v=<first 10 hex of its
# sha256>. Never edit the ?v= values by hand: run  python3 tools/version_assets.py <theme>/login
styles=css/chert.css?v=d051b2078c
# Forces <html dir="ltr"> for Arabic (translation-only rule; see GUIDE.md §4). Must exist (a missing
# entry 404s like css/login.css).
scripts=js/ltr.js?v=985638942f
locales=en,ar
# Light design (cream/ink form + dark brand panel); keycloak.v2's OS-driven dark mode would recolour
# the form card behind these styles.
darkMode=false

# ---- Project settings (set by tools/apply_project.py from project.json) ---------------------------
# Language pill: the OIDC client id of YOUR app and the app path that switches its UI language and
# returns to sign-in. {code} becomes en/ar. Leave chertLangSwitchPath empty to use Keycloak's own
# switch everywhere (e.g. if the app has no language endpoint yet).
chertAppClientId=portal
chertLangSwitchPath=/lang/{code}?next=/login
# Brand-panel bullet icons: lock wifi globe users shield chart book bolt layers grid cpu database
# calendar heart check
chertPoint1Icon=lock
chertPoint2Icon=wifi
chertPoint3Icon=globe
