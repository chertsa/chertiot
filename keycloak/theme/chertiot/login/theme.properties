parent=keycloak.v2
import=common/keycloak
# keycloak.v2 loads its PatternFly base automatically (common/keycloak/vendor/patternfly-v5); we only
# add the CHERT brand override. `css/login.css` does not exist in this theme or its parent — listing
# it made Keycloak serve a 404 with an empty MIME type, which the browser refused (console error).
# Cache-busting: Keycloak serves theme resources under /resources/<keycloak-build>/… with
# max-age=30 days, and that path does NOT change when this theme changes — browsers would keep the
# old CSS/JS for a month. ?v=<first 10 hex of the file's sha256> gives each version its own URL.
# portal/tests/unit/test_keycloak_theme_cache.py fails if a file changes without bumping its ?v=.
styles=css/chert.css?v=7d197cca80
# Local script (must exist — a missing entry would 404 like the old css/login.css did): forces the
# <html> dir attribute to ltr for Arabic, matching the LTR-only rule and the CSS override.
scripts=js/ltr.js?v=985638942f
locales=en,ar
# The CHERT login is a light design (cream/ink + dark brand panel); keycloak.v2's OS-driven dark
# mode would recolour the form card behind our styles.
darkMode=false
