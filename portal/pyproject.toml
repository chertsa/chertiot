[project]
name = "chertiot-portal"
version = "0.0.1"
description = "CHERT IoT portal — signup, provisioning, student pages"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "httpx==0.28.1",
  "tenacity==9.1.2",
  "jinja2==3.1.6",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "respx==0.22.0",
  "ruff==0.12.7",
  "mypy==1.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
per-file-ignores = { "tests/**" = ["S101"] }

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
