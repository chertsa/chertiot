[project]
name = "chertiot-portal"
version = "0.0.1"
description = "CHERT IoT portal — signup, provisioning, student pages"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "httpx==0.28.1",
  "tenacity==9.1.2",
  "jinja2==3.1.6",
  "prometheus-fastapi-instrumentator==7.1.0",
  "authlib==1.8.0",
  "itsdangerous==2.2.0",
  "python-multipart==0.0.32",
  "alembic==1.19.1",
  "babel==2.18.0",
  "docker==7.2.0",
  "python-socketio==5.16.4",
  "websocket-client==1.9.2",
  "chirpstack-api==4.19.0",
  "grpcio==1.83.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "respx==0.22.0",
  "ruff==0.12.7",
  "mypy==1.17.1",
  "paho-mqtt==2.1.0",
  "types-authlib==1.7.2.20260827",
  "mkdocs-static-i18n==1.3.1",
  "mkdocs-material==9.7.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom
per-file-ignores = { "tests/**" = ["S101", "S105", "S106"], "app/routers/signup.py" = ["S105"] }  # S105: error-message dict keys named "password"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "chirpstack_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
