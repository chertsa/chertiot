{# Decorative architecture diagram (aria-hidden): devices → isolated project → build & analyze.
   CHERT palette, inline SVG, no external assets. Labels use gettext so they follow the language. #}
<svg class="lp-diagram" viewBox="0 0 860 300" role="img" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'IBM Plex Sans Arabic', system-ui, sans-serif">
  <defs>
    <marker id="lp-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0l6 3-6 3z" fill="#F26B33"/>
    </marker>
  </defs>

  <!-- connectors -->
  <path d="M250 150 H300" stroke="#F26B33" stroke-width="2.5" fill="none" marker-end="url(#lp-arrow)"/>
  <path d="M560 150 H610" stroke="#F26B33" stroke-width="2.5" fill="none" marker-end="url(#lp-arrow)"/>

  <!-- stage 1: devices -->
  <rect x="20" y="60" width="230" height="180" rx="16" fill="#FFFFFF" stroke="#ECE0C2" stroke-width="1.5"/>
  <text x="135" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A18">{{ _("Your devices") }}</text>
  <g>
    <rect x="48" y="112" width="174" height="34" rx="8" fill="#FFFAE4" stroke="#ECE0C2"/>
    <text x="135" y="134" text-anchor="middle" font-size="12.5" fill="#6B6B66">ESP32 · Raspberry Pi</text>

    <rect x="48" y="196" width="174" height="30" rx="8" fill="#FFF0E6" stroke="#F8C9A8"/>
    <text x="135" y="216" text-anchor="middle" font-size="12" fill="#F26B33">{{ _("secure MQTTS :8883") }}</text>
  </g>

  <text x="430" y="78" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#F26B33">CHERT IoT</text>
  <text x="430" y="104" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1A1A18">{{ _("Your project") }}</text>
  <text x="430" y="124" text-anchor="middle" font-size="12" fill="#6B6B66">{{ _("an isolated workspace") }}</text>
  <g>
    <rect x="326" y="142" width="96" height="30" rx="15" fill="#FFFAE4" stroke="#ECE0C2"/>
    <text x="374" y="162" text-anchor="middle" font-size="11.5" fill="#1A1A18">{{ _("Devices") }}</text>
    <rect x="438" y="142" width="96" height="30" rx="15" fill="#FFFAE4" stroke="#ECE0C2"/>
    <text x="486" y="162" text-anchor="middle" font-size="11.5" fill="#1A1A18">{{ _("Telemetry") }}</text>
    <rect x="326" y="180" width="96" height="30" rx="15" fill="#FFFAE4" stroke="#ECE0C2"/>
    <text x="374" y="200" text-anchor="middle" font-size="11.5" fill="#1A1A18">{{ _("Alerts") }}</text>
    <rect x="438" y="180" width="96" height="30" rx="15" fill="#FFFAE4" stroke="#ECE0C2"/>
    <text x="486" y="200" text-anchor="middle" font-size="11.5" fill="#1A1A18">{{ _("Team") }}</text>

    <text x="430" y="236" text-anchor="middle" font-size="11" fill="#1F7A46">{{ _("single sign-on · your data only") }}</text>

  <text x="725" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A18">{{ _("Build & analyse") }}</text>
  <g font-size="12.5" fill="#6B6B66">

    <rect x="638" y="144" width="174" height="28" rx="8" fill="#FFFAE4" stroke="#ECE0C2"/>
